name: Build Windows Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4' 

      - name: Build Windows binary
        run: |
          go build -ldflags "-H=windowsgui" -o client-win.exe ./client.go

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: client-win.exe
